<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" 
  integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  
  <link id="pagestyle" href="material-dashboard.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Lato&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.jpg" type="image/x-icon">
  <style>
    .content {
  margin: 20px;
  height: 400px;
  max-width: 400px;
  overflow: hidden;
  box-shadow: 1px 1px 15px;
  position: relative;
}

.slides {
  display: flex;
  width: 100%; /* 4 images = 100% each */
  height: 100%;
  transition: transform 1s ease-in-out;
}

.slides img {
  width: 100%;
  height: 105%;
  flex-shrink: 0;
  object-fit: cover;
}

</style>
</head>
<body>
    <div class="content">
        <div class="slides">
            <img src="transit/lighter.jpg">
            <img src="transit/debi.jpg">
            <img src="transit/dul.jpg">
            <img src="transit/somudroghotok.jpg">
        </div>
    </div>
<script>
  const slidesContainer = document.querySelector('.slides');
  const images = document.querySelectorAll('.slides img');
  const totalImages = images.length;

  let index = 0;

  // Clone the first image and append it
  const firstClone = images[0].cloneNode(true);
  slidesContainer.appendChild(firstClone);

  function slideShow() {
    index++;
    slidesContainer.style.transition = "transform 1s ease-in-out";
    slidesContainer.style.transform = `translateX(-${index * 100}%)`;

    if (index === totalImages) {
      setTimeout(() => {
        // Instantly reset to the real first slide
        slidesContainer.style.transition = "none";
        slidesContainer.style.transform = `translateX(0)`;
        index = 0;
      }, 1000); // must match the transition duration
    }

    setTimeout(slideShow, 2500); // Repeat every 5 seconds
  }

  setTimeout(slideShow, 2500);
</script>

</body>
